name: Aggregate

on:
  schedule:
    - cron: "0 8 * * 3,5" # 8 a.m. every wednesday and friday UTC
    # - cron: "0 8 * * *" # Every day at 8
    # - cron: "0 * * * *" # Every hour
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
    - name: setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - run: pip install requests pgpy python-dateutil
    - name: Run aggregator
      run: python3 .github/aggregation/csaf_scraper.py
    - name: Create Pull Request
      id: create_pr
      uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
      with:
        commit-message: "CSAF updates"
        title: "CSAF updates"
        author: Automated <actions@users.noreply.github.com>
        branch: csaf-updates
        base: develop